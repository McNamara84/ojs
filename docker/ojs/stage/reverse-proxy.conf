# Traefik terminiert TLS und spricht HTTP mit dem Container. OJS erkennt HTTPS
# ueber $_SERVER['HTTPS'] – ohne diese Zeile erzeugt es http://-Links (Mixed Content).
# Der Container ist nur ueber Traefik erreichbar, der Header ist daher vertrauenswuerdig.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
