server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Keine nginx-Version in Fehlerseiten und Headern
    server_tokens off;

    # Relative Weiterleitungen ausliefern. Traefik terminiert TLS, nginx wuerde
    # sonst absolute Adressen mit http:// und ggf. falschem Port erzeugen.
    absolute_redirect off;

    # Rein statische Sammlung: keine Verzeichnislisten ausliefern
    autoindex off;

    # /emtf ohne Schraegstrich auf /emtf/ fuehren
    location = /emtf {
        return 301 /emtf/;
    }

    location /emtf/ {
        try_files $uri $uri/ =404;

        # Archivinhalte aendern sich nicht mehr
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Alles ausserhalb von /emtf/ gehoert nicht zu diesem Container
    location / {
        return 404;
    }
}
