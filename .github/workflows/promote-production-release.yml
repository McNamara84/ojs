name: Promote Production Release

# Befoerdert genau den Image-Digest nach deploy/prod, der fuer denselben Commit
# bereits auf Stage lief. Produktion bekommt damit nie ein frisch gebautes Image,
# sondern exakt das auf Stage erprobte Manifest.
#
# Ablauf: Release veroeffentlichen -> "Production Release Signal" (ohne Rechte)
# -> dieser Workflow, geladen aus dem Standard-Branch.

on:
  workflow_run:
    workflows:
      - Production Release Signal
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: promote-production-release
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event.workflow_run.event == 'release' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      app_image: ${{ steps.source.outputs.app_image }}
      emtf_image: ${{ steps.source.outputs.emtf_image }}
      checks_ready: ${{ steps.deployment-checks.outputs.ready }}
      current: ${{ steps.source.outputs.current }}
      release_id: ${{ steps.release.outputs.id }}
      release_tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Resolve the latest stable release
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const response = await github.rest.repos.getLatestRelease({ ...context.repo });
            const release = response.data;
            const stableTagPattern = /^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/;

            const compareVersions = (leftTag, rightTag) => {
              const left = leftTag.slice(1).split('.').map((part) => BigInt(part));
              const right = rightTag.slice(1).split('.').map((part) => BigInt(part));

              for (let index = 0; index < 3; index += 1) {
                if (left[index] > right[index]) return 1;
                if (left[index] < right[index]) return -1;
              }

              return 0;
            };

            if (release.draft || release.prerelease || !stableTagPattern.test(release.tag_name)) {
              core.setFailed(
                `GitHub's latest release is not a stable vMAJOR.MINOR.PATCH release: ${release.tag_name}`
              );
              return;
            }

            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo,
              per_page: 100,
            });
            const stableReleaseTags = releases
              .filter((candidate) =>
                !candidate.draft &&
                !candidate.prerelease &&
                stableTagPattern.test(candidate.tag_name)
              )
              .map((candidate) => candidate.tag_name);

            if (!stableReleaseTags.includes(release.tag_name)) {
              stableReleaseTags.push(release.tag_name);
            }

            const highestStableTag = stableReleaseTags.reduce(
              (highest, candidate) => (compareVersions(candidate, highest) > 0 ? candidate : highest)
            );

            if (compareVersions(release.tag_name, highestStableTag) < 0) {
              core.setFailed(
                `Production release candidate ${release.tag_name} is not the highest published stable release ${highestStableTag}.`
              );
              return;
            }

            try {
              const deployedBranch = await github.rest.repos.getBranch({
                ...context.repo,
                branch: 'deploy/prod',
              });
              const deployedSubject = deployedBranch.data.commit.commit.message.split('\n', 1)[0];
              const deploymentMatch = deployedSubject.match(
                /^Deploy Production (v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)) from [0-9a-f]{40}$/
              );

              if (!deploymentMatch) {
                core.setFailed(`The deploy/prod head has an invalid deployment subject: ${deployedSubject}`);
                return;
              }

              if (compareVersions(release.tag_name, deploymentMatch[1]) < 0) {
                core.setFailed(
                  `Production release candidate ${release.tag_name} is older than deployed release ${deploymentMatch[1]}.`
                );
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            core.setOutput('id', String(release.id));
            core.setOutput('tag', release.tag_name);

      - name: Checkout the latest stable release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Resolve and validate the release source
        id: source
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          git check-ref-format "refs/tags/${RELEASE_TAG}"
          git fetch --force --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

          SOURCE_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          OWNER="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          CURRENT=false

          # Der Release muss auf main liegen - sonst wuerde Code promoted, der nie
          # die Stage-Pruefungen durchlaufen hat.
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main

          if [[ "$SOURCE_SHA" == "$TRIGGER_SHA" ]]; then
            CURRENT=true
          else
            echo "Skipping release signal for $TRIGGER_SHA because the latest stable release resolves to $SOURCE_SHA."
          fi

          {
            echo "current=$CURRENT"
            echo "sha=$SOURCE_SHA"
            echo "app_image=ghcr.io/${OWNER}/ojs-app"
            echo "emtf_image=ghcr.io/${OWNER}/ojs-emtf"
          } >> "$GITHUB_OUTPUT"

      - name: Require successful deployment checks
        if: steps.source.outputs.current == 'true'
        id: deployment-checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const requiredWorkflows = [
              ['stage-checks.yml', 'Stage Checks'],
              ['publish-stage-images.yml', 'Publish Stage Images'],
            ];
            const sourceSha = process.env.SOURCE_SHA;
            const results = [];

            for (const [workflowId, workflowName] of requiredWorkflows) {
              const response = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: workflowId,
                head_sha: sourceSha,
                per_page: 20,
              });
              const run = response.data.workflow_runs
                .filter((candidate) => candidate.head_sha === sourceSha)
                .sort((left, right) => right.id - left.id)[0];

              results.push({
                name: workflowName,
                status: run?.status ?? 'missing',
                conclusion: run?.conclusion ?? '-',
                url: run?.html_url ?? '',
              });
            }

            await core.summary
              .addHeading(`Deployment checks for ${sourceSha}`)
              .addTable([
                [
                  { data: 'Workflow', header: true },
                  { data: 'Status', header: true },
                  { data: 'Conclusion', header: true },
                ],
                ...results.map((result) => [
                  result.url ? `<a href="${result.url}">${result.name}</a>` : result.name,
                  result.status,
                  result.conclusion,
                ]),
              ])
              .write();

            const ready = results.every(
              (result) => result.status === 'completed' && result.conclusion === 'success'
            );
            core.setOutput('ready', ready ? 'true' : 'false');

            if (!ready) {
              core.notice(
                `Production promotion is blocked for ${sourceSha}: ` +
                results
                  .filter((result) => result.status !== 'completed' || result.conclusion !== 'success')
                  .map((result) => `${result.name}: ${result.status}/${result.conclusion}`)
                  .join(', ')
              );
            }

  inspect:
    needs: validate
    if: >-
      needs.validate.outputs.current == 'true' &&
      needs.validate.outputs.checks_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Fuer GHCR-Login, "imagetools inspect" und den Trivy-Scan des Digests.
      packages: read
    outputs:
      app_digest: ${{ steps.artifacts.outputs.app_digest }}
      emtf_digest: ${{ steps.artifacts.outputs.emtf_digest }}
      current: ${{ steps.latest.outputs.current }}

    steps:
      - name: Checkout the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the exact Stage deployment artifact
        id: artifacts
        env:
          APP_IMAGE: ${{ needs.validate.outputs.app_image }}
          EMTF_IMAGE: ${{ needs.validate.outputs.emtf_image }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
          # Nur fuer "compose config" (Pflichtvariablen); Portainer liefert die echten Werte.
          OJS_DB_PASSWORD: ci-dummy
          OJS_DB_ROOT_PASSWORD: ci-dummy
          MAIL_HOST: smtp.example.org
        run: |
          set -euo pipefail

          git fetch --no-tags origin "+refs/heads/deploy/stage:refs/remotes/origin/deploy/stage"

          STAGE_DEPLOY_COMMIT=""

          while IFS= read -r candidate; do
            if [[ "$(git show -s --format=%s "$candidate")" == "Deploy Stage from $SOURCE_SHA" ]]; then
              STAGE_DEPLOY_COMMIT="$candidate"
              break
            fi
          done < <(git rev-list --first-parent refs/remotes/origin/deploy/stage)

          if [[ -z "$STAGE_DEPLOY_COMMIT" ]]; then
            echo "No Stage deployment commit exists for release source $SOURCE_SHA." >&2
            exit 1
          fi

          SOURCE_IS_PARENT=false

          for parent in $(git show -s --format=%P "$STAGE_DEPLOY_COMMIT"); do
            if [[ "$parent" == "$SOURCE_SHA" ]]; then
              SOURCE_IS_PARENT=true
              break
            fi
          done

          if [[ "$SOURCE_IS_PARENT" != true ]]; then
            echo "Stage deployment commit $STAGE_DEPLOY_COMMIT does not retain source $SOURCE_SHA as a parent." >&2
            exit 1
          fi

          STAGE_COMPOSE="${RUNNER_TEMP}/docker-compose.stage.yml"
          git show "${STAGE_DEPLOY_COMMIT}:docker-compose.stage.yml" > "$STAGE_COMPOSE"
          STAGE_CONFIG="$(docker compose -f "$STAGE_COMPOSE" config --format json)"

          APP_REF="$(jq -r '.services["ojs-app"].image' <<< "$STAGE_CONFIG")"
          APP_DIGEST="${APP_REF#"${APP_IMAGE}@"}"

          if [[ "$APP_REF" != "${APP_IMAGE}@${APP_DIGEST}" || ! "$APP_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid Stage application image reference: $APP_REF" >&2
            exit 1
          fi

          for service in ojs-queue ojs-scheduler; do
            if [[ "$(jq -r --arg service "$service" '.services[$service].image' <<< "$STAGE_CONFIG")" != "$APP_REF" ]]; then
              echo "Stage service $service does not use the release application image." >&2
              exit 1
            fi
          done

          EMTF_REF="$(jq -r '.services["ojs-emtf"].image' <<< "$STAGE_CONFIG")"
          EMTF_DIGEST="${EMTF_REF#"${EMTF_IMAGE}@"}"

          if [[ "$EMTF_REF" != "${EMTF_IMAGE}@${EMTF_DIGEST}" || ! "$EMTF_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid Stage EMTF image reference: $EMTF_REF" >&2
            exit 1
          fi

          # Die Manifeste muessen weiterhin existieren, sonst zeigt deploy/prod ins Leere.
          docker buildx imagetools inspect "$APP_REF" >/dev/null
          docker buildx imagetools inspect "$EMTF_REF" >/dev/null

          {
            echo "app_digest=$APP_DIGEST"
            echo "emtf_digest=$EMTF_DIGEST"
            echo "stage_commit=$STAGE_DEPLOY_COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare Trivy cache
        run: mkdir -p "${{ runner.temp }}/trivy-cache"

      - name: Scan the exact promoted image digest
        env:
          APP_IMAGE_REF: ${{ needs.validate.outputs.app_image }}@${{ steps.artifacts.outputs.app_digest }}
          EMTF_IMAGE_REF: ${{ needs.validate.outputs.emtf_image }}@${{ steps.artifacts.outputs.emtf_digest }}
          TRIVY_DISABLE_VEX_NOTICE: 'true'
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail

          for image_ref in "$APP_IMAGE_REF" "$EMTF_IMAGE_REF"; do
            if [[ ! "$image_ref" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid Production image reference: $image_ref" >&2
              exit 1
            fi

            echo "::group::Trivy $image_ref"
            docker run --rm \
              -e TRIVY_DISABLE_VEX_NOTICE \
              -e TRIVY_PASSWORD \
              -e TRIVY_USERNAME \
              -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy" \
              -v "$PWD/.trivyignore:/work/.trivyignore:ro" \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image \
              --cache-dir /root/.cache/trivy \
              --ignorefile /work/.trivyignore \
              --scanners vuln \
              --format table \
              --exit-code 1 \
              --ignore-unfixed \
              --pkg-types os,library \
              --severity CRITICAL,HIGH \
              --skip-version-check \
              "$image_ref"
            echo "::endgroup::"
          done

      - name: Confirm that the release is still latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail

          LATEST_RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.id')"
          LATEST_RELEASE_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          LATEST_SOURCE_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"

          if [[ "$LATEST_RELEASE_ID" == "$RELEASE_ID" &&
              "$LATEST_RELEASE_TAG" == "$RELEASE_TAG" &&
              "$LATEST_SOURCE_SHA" == "$SOURCE_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded Production release $RELEASE_TAG."
          fi

  promote:
    needs:
      - validate
      - inspect
    if: needs.inspect.outputs.current == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0

      - name: Create the digest-pinned Production deployment commit
        id: deployment
        env:
          APP_DIGEST: ${{ needs.inspect.outputs.app_digest }}
          APP_IMAGE: ${{ needs.validate.outputs.app_image }}
          EMTF_DIGEST: ${{ needs.inspect.outputs.emtf_digest }}
          EMTF_IMAGE: ${{ needs.validate.outputs.emtf_image }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
          # Nur fuer "compose config" (Pflichtvariablen); Portainer liefert die echten Werte.
          OJS_DB_PASSWORD: ci-dummy
          OJS_DB_ROOT_PASSWORD: ci-dummy
          MAIL_HOST: smtp.example.org
        run: |
          set -euo pipefail

          for digest in "$APP_DIGEST" "$EMTF_DIGEST"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid image digest: $digest" >&2
              exit 1
            fi
          done

          APP_TEMPLATE="${APP_IMAGE}:deployment-template"
          EMTF_TEMPLATE="${EMTF_IMAGE}:deployment-template"
          PROD_COMPOSE="${RUNNER_TEMP}/docker-compose.prod.yml"

          git cat-file -e "${SOURCE_SHA}^{commit}"
          git show "${SOURCE_SHA}:docker-compose.prod.yml" > "$PROD_COMPOSE"

          APP_TEMPLATE_COUNT="$(grep -Fc "$APP_TEMPLATE" "$PROD_COMPOSE")"
          EMTF_TEMPLATE_COUNT="$(grep -Fc "$EMTF_TEMPLATE" "$PROD_COMPOSE")"

          if [[ "$APP_TEMPLATE_COUNT" -ne 3 || "$EMTF_TEMPLATE_COUNT" -ne 1 ]]; then
            echo "Unexpected Production image template count: app=$APP_TEMPLATE_COUNT emtf=$EMTF_TEMPLATE_COUNT" >&2
            exit 1
          fi

          sed -i "s|${APP_TEMPLATE}|${APP_IMAGE}@${APP_DIGEST}|g" "$PROD_COMPOSE"
          sed -i "s|${EMTF_TEMPLATE}|${EMTF_IMAGE}@${EMTF_DIGEST}|g" "$PROD_COMPOSE"

          if grep -Fq "$APP_TEMPLATE" "$PROD_COMPOSE" || grep -Fq "$EMTF_TEMPLATE" "$PROD_COMPOSE"; then
            echo "Production image templates remain after digest pinning." >&2
            exit 1
          fi

          docker compose -f "$PROD_COMPOSE" config --quiet

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Der Deployment-Commit traegt den Baum des Release-Commits, nur mit
          # gepinnter Prod-Compose-Datei.
          DEPLOY_BLOB="$(git hash-object -w "$PROD_COMPOSE")"
          git read-tree "${SOURCE_SHA}^{tree}"
          git update-index --add --cacheinfo "100644,${DEPLOY_BLOB},docker-compose.prod.yml"

          PREVIOUS_DEPLOY_SHA="$(git ls-remote --heads origin refs/heads/deploy/prod | awk '{print $1}')"
          PARENTS=(-p "$SOURCE_SHA")

          if [[ -n "$PREVIOUS_DEPLOY_SHA" ]]; then
            git fetch --no-tags origin "+refs/heads/deploy/prod:refs/remotes/origin/deploy/prod"

            DEPLOYED_SUBJECT="$(git show -s --format=%s "$PREVIOUS_DEPLOY_SHA")"
            DEPLOYMENT_SUBJECT_PATTERN='^Deploy Production (v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)) from [0-9a-f]{40}$'

            if [[ ! "$DEPLOYED_SUBJECT" =~ $DEPLOYMENT_SUBJECT_PATTERN ]]; then
              echo "The deploy/prod head has an invalid deployment subject: $DEPLOYED_SUBJECT" >&2
              exit 1
            fi

            PARENTS=(-p "$PREVIOUS_DEPLOY_SHA")

            if [[ "$PREVIOUS_DEPLOY_SHA" != "$SOURCE_SHA" ]]; then
              PARENTS+=(-p "$SOURCE_SHA")
            fi
          fi

          DEPLOY_TREE="$(git write-tree)"
          DEPLOY_COMMIT="$(git commit-tree "$DEPLOY_TREE" "${PARENTS[@]}" -m "Deploy Production $RELEASE_TAG from $SOURCE_SHA")"

          {
            echo "commit=$DEPLOY_COMMIT"
            echo "previous=$PREVIOUS_DEPLOY_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Advance the digest-pinned Production deployment branch
        env:
          DEPLOY_COMMIT: ${{ steps.deployment.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_DEPLOY_SHA: ${{ steps.deployment.outputs.previous }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail

          LATEST_RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.id')"
          LATEST_RELEASE_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          git fetch --force --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          LATEST_SOURCE_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"

          if [[ "$LATEST_RELEASE_ID" != "$RELEASE_ID" ||
              "$LATEST_RELEASE_TAG" != "$RELEASE_TAG" ||
              "$LATEST_SOURCE_SHA" != "$SOURCE_SHA" ]]; then
            echo "A newer stable release appeared while preparing Production; leaving deploy/prod unchanged."
            exit 0
          fi

          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main

          if [[ -n "$PREVIOUS_DEPLOY_SHA" ]]; then
            DEPLOY_LEASE="--force-with-lease=refs/heads/deploy/prod:${PREVIOUS_DEPLOY_SHA}"
          else
            DEPLOY_LEASE="--force-with-lease=refs/heads/deploy/prod:"
          fi

          git push "$DEPLOY_LEASE" origin "${DEPLOY_COMMIT}:refs/heads/deploy/prod"
