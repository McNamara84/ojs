name: Stage Checks

# Gate fuer das Stage-Deployment: Ein erfolgreicher Push-Lauf auf main startet
# "Publish Stage Images" (workflow_run). In Pull Requests dient er als Vorab-Pruefung.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: stage-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  STAGE_TEMPLATE: ghcr.io/mcnamara84/ojs-app:deployment-template
  STAGE_TEMPLATE_COUNT: '3'
  EMTF_TEMPLATE: ghcr.io/mcnamara84/ojs-emtf:deployment-template
  EMTF_TEMPLATE_COUNT: '1'
  CI_IMAGE: ojs-app:ci
  CI_EMTF_IMAGE: ojs-emtf:ci

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile (hadolint)
        run: |
          docker run --rm -i \
            hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint --failure-threshold warning - < docker/ojs/Dockerfile

      - name: Lint shell scripts (shellcheck)
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            --shell=sh docker/ojs/stage/ojs-stage-start docker/ojs/stage/ojs-worker

      - name: Lint workflows (actionlint)
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      - name: Check the static EMTF collection for dead local links
        run: python3 scripts/check-emtf-links.py emtf

      - name: Validate Compose files
        env:
          # Dummy-Werte nur fuer die Syntaxpruefung der Pflichtvariablen
          OJS_DB_PASSWORD: ci-dummy
          OJS_DB_ROOT_PASSWORD: ci-dummy
          MAIL_HOST: smtp.example.org
        run: |
          set -euo pipefail
          docker compose -f docker-compose.dev.yml --env-file .env.example config --quiet
          docker compose -f docker-compose.stage.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Require the deployment image template markers
        run: |
          set -euo pipefail
          for compose in docker-compose.stage.yml docker-compose.prod.yml; do
            app_count="$(grep -Fc "$STAGE_TEMPLATE" "$compose")"
            emtf_count="$(grep -Fc "$EMTF_TEMPLATE" "$compose")"
            if [[ "$app_count" -ne "$STAGE_TEMPLATE_COUNT" || "$emtf_count" -ne "$EMTF_TEMPLATE_COUNT" ]]; then
              echo "Unexpected image template count in $compose: app=$app_count emtf=$emtf_count." >&2
              exit 1
            fi
          done

  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve system package refresh date
        id: system-packages-refresh
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build Stage image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/ojs
          target: stage
          load: true
          push: false
          tags: ${{ env.CI_IMAGE }}
          build-args: |
            SYSTEM_PACKAGES_REFRESH=${{ steps.system-packages-refresh.outputs.date }}
          cache-from: |
            type=gha,scope=stage-checks
            type=gha,scope=stage-app
          cache-to: type=gha,mode=max,scope=stage-checks

      - name: Build the static EMTF image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/emtf/Dockerfile
          load: true
          push: false
          tags: ${{ env.CI_EMTF_IMAGE }}
          cache-from: |
            type=gha,scope=emtf-checks
            type=gha,scope=emtf
          cache-to: type=gha,mode=max,scope=emtf-checks

      - name: Syntax-check PHP helpers inside the image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint php "$CI_IMAGE" -l /usr/local/lib/ojs/ojs-configure.php
          docker run --rm --entrypoint php "$CI_IMAGE" -l /usr/local/lib/ojs/ojs-version-check.php
          docker run --rm --entrypoint php "$CI_IMAGE" -l /usr/local/bin/ojs-healthcheck

      - name: Smoke-test the Stage Compose stack
        env:
          OJS_DB_PASSWORD: ci-db-password
          OJS_DB_ROOT_PASSWORD: ci-root-password
          MAIL_HOST: smtp.example.org
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ci-override.yml" <<EOF
          services:
            ojs-app: { image: $CI_IMAGE, pull_policy: never }
            ojs-queue: { image: $CI_IMAGE, pull_policy: never }
            ojs-scheduler: { image: $CI_IMAGE, pull_policy: never }
            ojs-emtf: { image: $CI_EMTF_IMAGE, pull_policy: never }
          EOF

          compose() {
            docker compose -p ojs-ci -f docker-compose.stage.yml -f "$RUNNER_TEMP/ci-override.yml" "$@"
          }

          docker network create traefik
          if ! compose up -d --wait --wait-timeout 300; then
            compose ps
            compose logs
            exit 1
          fi

          request() {
            docker run --rm --network traefik \
              curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6 \
              -s -H 'Host: ojs.rz-vm182.gfz.de' -H 'X-Forwarded-Proto: https' "$@"
          }

          redirect="$(request -o /dev/null -w '%{http_code} %{redirect_url}' http://ojs-stage-app/)"
          echo "Root: $redirect"
          [[ "$redirect" == "302 https://ojs.rz-vm182.gfz.de/index/en/install" ]]

          installer="$(request http://ojs-stage-app/index/en/install)"
          grep -q 'action="https://ojs.rz-vm182.gfz.de/index/en/install/install"' <<< "$installer"
          if grep -Eq '(src|href)="http://ojs\.rz-vm182' <<< "$installer"; then
            echo "Installer contains insecure http:// links (mixed content)." >&2
            exit 1
          fi

          # Erst einsammeln: "logs | grep -q" kann mit pipefail an SIGPIPE scheitern
          worker_logs="$(compose logs ojs-queue ojs-scheduler)"
          grep -q 'ojs-worker:jobs\] OJS ist noch nicht installiert' <<< "$worker_logs"
          grep -q 'ojs-worker:scheduler\] OJS ist noch nicht installiert' <<< "$worker_logs"
          compose exec -T ojs-app grep -q '^job_runner = Off' /var/www/config/config.inc.php

          # Statische EMTF-Sammlung: Einstieg, Weiterleitung ohne Schraegstrich,
          # eine Unterseite und die Abgrenzung nach aussen.
          emtf_request() {
            docker run --rm --network traefik               curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6               -s -o /dev/null -w '%{http_code}' "http://ojs-stage-emtf$1"
          }

          [[ "$(emtf_request /emtf/)" == "200" ]]
          [[ "$(emtf_request /emtf)" == "301" ]]
          [[ "$(emtf_request /emtf/index.html)" == "200" ]]
          [[ "$(emtf_request /)" == "404" ]]

          compose down -v

      - name: Prepare Trivy cache
        run: mkdir -p "${{ runner.temp }}/trivy-cache"

      - name: Scan the images (Trivy)
        env:
          TRIVY_DISABLE_VEX_NOTICE: 'true'
        run: |
          set -euo pipefail

          for image in "$CI_IMAGE" "$CI_EMTF_IMAGE"; do
            echo "::group::Trivy $image"
            docker run --rm \
              -e TRIVY_DISABLE_VEX_NOTICE \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy" \
              -v "$PWD/.trivyignore:/work/.trivyignore:ro" \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image \
              --cache-dir /root/.cache/trivy \
              --ignorefile /work/.trivyignore \
              --scanners vuln \
              --format table \
              --exit-code 1 \
              --ignore-unfixed \
              --pkg-types os,library \
              --severity CRITICAL,HIGH \
              --skip-version-check \
              "$image"
            echo "::endgroup::"
          done
