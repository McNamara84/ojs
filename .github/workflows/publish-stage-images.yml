name: Publish Stage Images

# Baut das Stage-Image fuer einen validierten main-Commit, pusht es nach GHCR,
# scannt den exakten Digest und bewegt deploy/stage auf einen Commit, dessen
# docker-compose.stage.yml das Image per Digest pinnt. Portainer pollt deploy/stage.
#
# Bewusst ohne workflow_dispatch (wie ERNIE): Ein manueller Lauf koennte gegen einen
# anderen Branch mit dessen Workflow-Definition und Schreibrechten ausgefuehrt werden.
# Manueller Retry: den "Stage Checks"-Lauf des aktuellen main-Commits neu starten.

on:
  workflow_run:
    workflows:
      - Stage Checks
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-stage-images
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app_image: ${{ steps.source.outputs.app_image }}
      current: ${{ steps.source.outputs.current }}
      sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Checkout the candidate main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve source and image names
        id: source
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          SOURCE_SHA="$(git rev-parse HEAD)"
          OWNER="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"

          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"

          if [[ "$(git rev-parse refs/remotes/origin/main)" == "$SOURCE_SHA" ]]; then
            CURRENT=true
          else
            CURRENT=false
            echo "Skipping stale commit $SOURCE_SHA because main has advanced."
          fi

          {
            echo "current=$CURRENT"
            echo "sha=$SOURCE_SHA"
            echo "app_image=ghcr.io/${OWNER}/ojs-app"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: validate
    if: needs.validate.outputs.current == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout the validated main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0

      - name: Resolve system package refresh date
        id: system-packages-refresh
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Stage image
        id: app-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/ojs
          target: stage
          push: true
          tags: ${{ needs.validate.outputs.app_image }}:sha-${{ needs.validate.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
            org.opencontainers.image.version=sha-${{ needs.validate.outputs.sha }}
          build-args: |
            SYSTEM_PACKAGES_REFRESH=${{ steps.system-packages-refresh.outputs.date }}
          cache-from: |
            type=gha,scope=stage-app
            type=gha,scope=stage-checks
          cache-to: type=gha,mode=max,scope=stage-app

      - name: Prepare Trivy cache
        run: mkdir -p "${{ runner.temp }}/trivy-cache"

      - name: Scan the exact published image digest
        env:
          APP_IMAGE_REF: ${{ needs.validate.outputs.app_image }}@${{ steps.app-build.outputs.digest }}
          TRIVY_DISABLE_VEX_NOTICE: 'true'
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail

          if [[ ! "$APP_IMAGE_REF" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid published image reference: $APP_IMAGE_REF" >&2
            exit 1
          fi

          docker run --rm \
            -e TRIVY_DISABLE_VEX_NOTICE \
            -e TRIVY_PASSWORD \
            -e TRIVY_USERNAME \
            -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy" \
            -v "$PWD/.trivyignore:/work/.trivyignore:ro" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image \
            --cache-dir /root/.cache/trivy \
            --ignorefile /work/.trivyignore \
            --scanners vuln \
            --format table \
            --exit-code 1 \
            --ignore-unfixed \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --skip-version-check \
            "$APP_IMAGE_REF"

      - name: Confirm that the candidate is still current
        id: latest
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"

          if [[ "$(git rev-parse refs/remotes/origin/main)" == "$SOURCE_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "The image remains available by SHA, but a newer main commit will be promoted instead."
          fi

      - name: Create digest-pinned Stage deployment commit
        if: steps.latest.outputs.current == 'true'
        id: deployment
        env:
          APP_DIGEST: ${{ steps.app-build.outputs.digest }}
          APP_IMAGE: ${{ needs.validate.outputs.app_image }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
          # Nur fuer "compose config" (Pflichtvariablen); Portainer liefert die echten Werte.
          OJS_DB_PASSWORD: ci-dummy
          OJS_DB_ROOT_PASSWORD: ci-dummy
          MAIL_HOST: smtp.example.org
        run: |
          set -euo pipefail

          if [[ ! "$APP_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid application image digest: $APP_DIGEST" >&2
            exit 1
          fi

          APP_TEMPLATE="${APP_IMAGE}:deployment-template"
          APP_TEMPLATE_COUNT="$(grep -Fc "$APP_TEMPLATE" docker-compose.stage.yml)"

          if [[ "$APP_TEMPLATE_COUNT" -ne 3 ]]; then
            echo "Unexpected Stage image template count: app=$APP_TEMPLATE_COUNT" >&2
            exit 1
          fi

          sed -i "s|${APP_TEMPLATE}|${APP_IMAGE}@${APP_DIGEST}|g" docker-compose.stage.yml

          if grep -Fq "$APP_TEMPLATE" docker-compose.stage.yml; then
            echo "Stage image templates remain after digest pinning." >&2
            exit 1
          fi

          docker compose -f docker-compose.stage.yml config --quiet

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.stage.yml

          PREVIOUS_DEPLOY_SHA="$(git ls-remote --heads origin refs/heads/deploy/stage | awk '{print $1}')"
          PARENTS=(-p "$SOURCE_SHA")

          if [[ -n "$PREVIOUS_DEPLOY_SHA" ]]; then
            git fetch --no-tags origin \
              "+refs/heads/deploy/stage:refs/remotes/origin/deploy/stage"
            PARENTS=(-p "$PREVIOUS_DEPLOY_SHA")

            if [[ "$PREVIOUS_DEPLOY_SHA" != "$SOURCE_SHA" ]]; then
              PARENTS+=(-p "$SOURCE_SHA")
            fi
          fi

          DEPLOY_TREE="$(git write-tree)"
          DEPLOY_COMMIT="$(git commit-tree "$DEPLOY_TREE" "${PARENTS[@]}" -m "Deploy Stage from $SOURCE_SHA")"

          {
            echo "commit=$DEPLOY_COMMIT"
            echo "previous=$PREVIOUS_DEPLOY_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Advance the digest-pinned Stage deployment branch
        if: steps.latest.outputs.current == 'true'
        env:
          DEPLOY_COMMIT: ${{ steps.deployment.outputs.commit }}
          PREVIOUS_DEPLOY_SHA: ${{ steps.deployment.outputs.previous }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"

          if [[ "$(git rev-parse refs/remotes/origin/main)" != "$SOURCE_SHA" ]]; then
            echo "main advanced while preparing the deployment commit; leaving deploy/stage unchanged."
            exit 0
          fi

          if [[ -n "$PREVIOUS_DEPLOY_SHA" ]]; then
            DEPLOY_LEASE="--force-with-lease=refs/heads/deploy/stage:${PREVIOUS_DEPLOY_SHA}"
          else
            DEPLOY_LEASE="--force-with-lease=refs/heads/deploy/stage:"
          fi

          git push "$DEPLOY_LEASE" origin "${DEPLOY_COMMIT}:refs/heads/deploy/stage"
