name: Production Release Signal

# Nur ein Signal: Dieser Workflow hat keinerlei Schreibrechte. Er existiert, damit
# "Promote Production Release" per workflow_run aus dem Standard-Branch geladen wird
# und nicht aus dem Stand eines beliebigen Tags.

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest

    steps:
      - name: Record the unprivileged release signal
        env:
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          printf 'Release signal: tag=%s draft=%s prerelease=%s\n' \
            "$RELEASE_TAG" "$RELEASE_DRAFT" "$RELEASE_PRERELEASE"
